name: Refresh profile assets

# Regenerates the contribution hero + typing strip with fresh data every
# morning and commits the result if anything changed. Keeps the profile
# current without external metrics services.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: jacek4yang
        run: python assets/profile/fetch_contributions.py
      - name: Regenerate assets
        run: |
          python assets/profile/generate_hero.py
          python assets/profile/generate_typing.py
      - name: Commit if changed
        run: |
          git config user.name "jacek4yang"
          git config user.email "jacek4yang@outlook.com"
          git add assets/profile/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh profile assets ($(date -u +%F))"
            git push
          fi
